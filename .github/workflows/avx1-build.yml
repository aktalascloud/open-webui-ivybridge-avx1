name: AVX1 verified candidates
on:
  workflow_dispatch:
    inputs:
      day:
        description: Build date YYYYMMDD
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: avx1-candidates
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Identify native compiler and hosted SDK image
        id: native-inputs
        run: python .avx1/native_cache.py
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.native-inputs.outputs.cacheable == 'true'
        with:
          path: .avx1-native-cache
          key: ivy-native-${{ runner.os }}-${{ steps.native-inputs.outputs.key }}-${{ hashFiles('pyproject.toml', '.avx1/native_json.py', '.avx1/native_cache.py', '.avx1/common.py', '.avx1/native-policy.json') }}
      - name: Build, test, audit and package
        env:
          BUILD_CHANNEL: latest
          BUILD_DAY: ${{ inputs.day }}
          NPM_CONFIG_FETCH_TIMEOUT: '60000'
          NPM_CONFIG_FETCH_RETRIES: '2'
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '1000'
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '5000'

        run: python .avx1/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-latest
          path: .avx1-out/*
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - name: Upload safe diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostics-latest
          path: |
            .avx1-work/pip-audit.json
            .avx1-work/security-gate.json
            .avx1-work/browser-smoke-server.log
            .avx1-work/strata-reasoning-*.png
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3
