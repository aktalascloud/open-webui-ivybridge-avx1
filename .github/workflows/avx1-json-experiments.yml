name: Ivy Bridge JSON experiments
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheels:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [ivy-o3-fat-cgu1, ivy-o3-thin-cgu1, ivy-o3-thin-cgu8, ivy-o2-thin-cgu1]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile the exact locked source with explicit Ivy Bridge features
        env:
          JSON_EXPERIMENT: ${{ matrix.profile }}
        run: python .avx1/experiment_json.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: json-experiment-${{ matrix.profile }}
          path: .avx1-out/*
          retention-days: 2
          if-no-files-found: error
